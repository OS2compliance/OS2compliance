<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="dialogs">
    <!-- Confirm dialog: warn the user and let them continue or cancel (dialogService.showConfirm) -->
    <dialog id="dsConfirmDialog" class="ds-dialog">
        <div class="p-4 text-center">
            <div class="ds-icon mb-3" hidden>
                <svg class="ds-icon-warning" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:52px;height:52px" hidden>
                    <path d="M26 4L48 44H4L26 4Z" fill="#f0ad4e" stroke="#d4892a" stroke-width="2.5" stroke-linejoin="round"/>
                    <rect x="23.5" y="19" width="5" height="13" rx="2.5" fill="#fff"/>
                    <rect x="23.5" y="35" width="5" height="5" rx="2.5" fill="#fff"/>
                </svg>
                <svg class="ds-icon-info" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:52px;height:52px" hidden>
                    <circle cx="26" cy="26" r="22" fill="#5b9bd5" stroke="#3a7abf" stroke-width="2.5"/>
                    <rect x="23.5" y="22" width="5" height="13" rx="2.5" fill="#fff"/>
                    <rect x="23.5" y="14" width="5" height="5" rx="2.5" fill="#fff"/>
                </svg>
            </div>
            <p class="ds-title fw-semibold fs-5 mb-1" hidden></p>
            <p class="ds-text text-body mb-4 h4" hidden></p>
            <div class="d-flex justify-content-center gap-2">
                <button type="button" class="ds-cancel btn btn-danger btn-lg"></button>
                <button type="button" class="ds-confirm btn btn-success btn-lg"></button>
            </div>
        </div>
    </dialog>

    <!-- Alert dialog: inform the user without requiring a choice (dialogService.showAlert) -->
    <dialog id="dsAlertDialog" class="ds-dialog">
        <div class="p-4 text-center">
            <div class="ds-icon mb-3" hidden>
                <svg class="ds-icon-warning" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:52px;height:52px" hidden>
                    <path d="M26 4L48 44H4L26 4Z" fill="#f0ad4e" stroke="#d4892a" stroke-width="2.5" stroke-linejoin="round"/>
                    <rect x="23.5" y="19" width="5" height="13" rx="2.5" fill="#fff"/>
                    <rect x="23.5" y="35" width="5" height="5" rx="2.5" fill="#fff"/>
                </svg>
                <svg class="ds-icon-info" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:52px;height:52px" hidden>
                    <circle cx="26" cy="26" r="22" fill="#5b9bd5" stroke="#3a7abf" stroke-width="2.5"/>
                    <rect x="23.5" y="22" width="5" height="13" rx="2.5" fill="#fff"/>
                    <rect x="23.5" y="14" width="5" height="5" rx="2.5" fill="#fff"/>
                </svg>
            </div>
            <p class="ds-title fw-semibold fs-5 mb-1" hidden></p>
            <p class="ds-text text-body mb-4 h4" hidden></p>
            <div class="d-flex justify-content-center gap-2">
                <button type="button" class="ds-confirm btn btn-primary btn-lg"></button>
            </div>
        </div>
    </dialog>

    <!-- Content dialog: filled with a server-rendered fragment (dialogService.openDialog) -->
    <dialog id="dsContentDialog" class="ds-dialog">
        <div id="dsContent"></div>
    </dialog>
</th:block>

</body>
</html>
