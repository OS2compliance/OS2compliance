<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Year Wheel Fragment</title>
</head>
<body>
<th:block th:fragment="yearWheel">
    <div id="yearWheelContent" style="display: none;">
        <!-- Active filter indicator -->
        <div class="year-wheel-filter-bar mb-2" id="yearWheelFilterBar" style="display: none;">
            <i class="pli-filter-2"></i>
            <span>Filtre fra tabellen er aktive:</span>
            <div class="filter-pills" id="yearWheelFilterPills"></div>
        </div>

        <div class="legend mb-3" id="yearWheelLegend">
            <span class="legend-label" style="font-size: 0.78rem; font-weight: 600; margin-right: 0.25rem;">Tags:</span>
        </div>

        <div class="year-grid" id="yearGrid"></div>

        <!-- Detail panel -->
        <div class="detail-panel mt-3 position-relative" id="detailPanel" style="display: none;">
            <button class="detail-close" type="button" id="detailClose" title="Luk">
                <i class="pli-close"></i>
            </button>
            <div class="detail-title" id="detailTitle"></div>
            <div class="detail-meta">
                <div class="detail-meta-item">
                    <i class="pli-calendar-4"></i>
                    Deadline: <strong id="detailDeadline"></strong>
                </div>
                <div class="detail-meta-item">
                    <i class="pli-reload"></i>
                    Gentagelse: <strong id="detailRepetition"></strong>
                </div>
                <div class="detail-meta-item">
                    <i class="pli-tag"></i>
                    Type: <strong id="detailType"></strong>
                </div>
                <div class="detail-meta-item">
                    <i class="pli-male"></i>
                    Ansvarlig: <strong id="detailResponsible"></strong>
                </div>
                <div class="detail-meta-item">
                    <i class="pli-building"></i>
                    Afdeling: <strong id="detailDept"></strong>
                </div>
                <div class="detail-meta-item">
                    <i class="pli-tag"></i>
                    Årshjul tags: <span id="detailTags"></span>
                </div>
                <div class="detail-meta-item">
                    <i class="pli-check"></i>
                    Status: <span id="detailStatus"></span>
                </div>
            </div>
            <div class="detail-actions">
                <a href="#" class="btn btn-sm btn-primary" id="detailLink">
                    <i class="pli-arrow-outside me-1"></i> Åbn opgave
                </a>
            </div>
        </div>
    </div>
</th:block>

<th:block th:fragment="yearWheelToggle">
    <div class="view-toggle-group" id="viewToggle">
        <button class="toggle-btn active" type="button" id="btnTableView">
            <i class="pli-list-view"></i> Liste
        </button>
        <button class="toggle-btn" type="button" id="btnYearWheel">
            <i class="pli-calendar-4"></i> Årshjul
        </button>
    </div>

    <div class="year-nav" id="yearNav" style="display: none;">
        <button type="button" id="yearPrev" title="Forrige år"><i class="pli-arrow-left"></i></button>
        <span class="year-label" id="yearLabel"></span>
        <button type="button" id="yearNext" title="Næste år"><i class="pli-arrow-right"></i></button>
    </div>

    <!-- Only visible for admins -->
    <div th:if="${hasReadAll}" class="form-check form-switch ms-3 d-none" id="onlyMineToggleContainer">
        <input class="form-check-input" type="checkbox" role="switch" id="onlyMineToggle">
        <label class="form-check-label small" style="margin-left: 10px;" for="onlyMineToggle">Kun mine opgaver</label>
    </div>
</th:block>
</body>
</html>
