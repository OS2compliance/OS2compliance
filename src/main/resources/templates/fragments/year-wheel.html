<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Year Wheel Fragment</title>
</head>
<body>
<th:block th:fragment="yearWheel">
    <div id="yearWheelContent" class="yw-hidden">
        <!-- Active filter indicator -->
        <div class="year-wheel-filter-bar mb-2 yw-hidden" id="yearWheelFilterBar">
            <i class="pli-filter-2"></i>
            <span>Filtre fra tabellen er aktive:</span>
            <div class="filter-pills" id="yearWheelFilterPills"></div>
        </div>

        <div class="legend mb-3" id="yearWheelLegend">
            <span class="legend-label">Tags:</span>
        </div>

        <div class="year-grid" id="yearGrid"></div>

        <!-- Detail panel -->
        <div class="detail-panel mt-3 position-relative yw-hidden" id="detailPanel">
            <button class="detail-close" type="button" id="detailClose" title="Luk">
                <i class="pli-close"></i>
            </button>
            <div class="detail-title" id="detailTitle"></div>
            <div class="detail-meta">
                <div class="detail-meta-item">
                    <i class="pli-calendar-4"></i>
                    Deadline: <strong id="detailDeadline"></strong>
                </div>
                <div class="detail-meta-item">
                    <i class="pli-reload"></i>
                    Gentagelse: <strong id="detailRepetition"></strong>
                </div>
                <div class="detail-meta-item">
                    <i class="pli-tag"></i>
                    Type: <strong id="detailType"></strong>
                </div>
                <div class="detail-meta-item">
                    <i class="pli-male"></i>
                    Ansvarlig: <strong id="detailResponsible"></strong>
                </div>
                <div class="detail-meta-item">
                    <i class="pli-building"></i>
                    Afdeling: <strong id="detailDept"></strong>
                </div>
                <div class="detail-meta-item">
                    <i class="pli-tag"></i>
                    Årshjul tags: <span id="detailTags"></span>
                </div>
                <div class="detail-meta-item">
                    <i class="pli-check"></i>
                    Status: <span id="detailStatus"></span>
                </div>
            </div>
            <div class="detail-actions">
                <a href="#" class="btn btn-sm btn-primary" id="detailLink">
                    <i class="pli-arrow-outside me-1"></i> Åbn opgave
                </a>
            </div>
        </div>
    </div>

    <!-- ==================== Templates ==================== -->

    <!-- Legend filter button -->
    <template id="tmplLegendButton">
        <button type="button" class="legend-filter-btn">
            <div class="legend-dot"></div>
            <span data-ref="label"></span>
        </button>
    </template>

    <!-- Month card -->
    <template id="tmplMonthCard">
        <div class="month-card">
            <div class="month-header">
                <span class="month-name" data-ref="monthName"></span>
                <span class="month-count yw-hidden" data-ref="monthCount"></span>
            </div>
            <div class="month-body" data-ref="monthBody"></div>
        </div>
    </template>

    <!-- Task chip -->
    <template id="tmplTaskChip">
        <div class="task-chip">
            <span class="task-chip-name" data-ref="chipName"></span>
        </div>
    </template>

    <!-- Status icons for task chips -->
    <template id="tmplChipIconCompleted">
        <i class="pli-yes yw-status-icon yw-status-completed" title="Udført"></i>
    </template>
    <template id="tmplChipIconOverdue">
        <i class="pli-exclamation yw-status-icon yw-status-overdue" title="Overskredet"></i>
    </template>

    <!-- Empty month message -->
    <template id="tmplMonthEmpty">
        <span class="month-empty">Ingen aktiviteter</span>
    </template>

    <!-- Detail panel tag badge -->
    <template id="tmplDetailTagBadge">
        <span class="detail-tag-badge" data-ref="badge"></span>
    </template>

    <!-- Detail panel status badge -->
    <template id="tmplStatusBadge">
        <span class="d-inline-block badge" data-ref="badge"></span>
    </template>

    <!-- Filter pill -->
    <template id="tmplFilterPill">
        <span class="filter-pill">
            <span class="filter-pill-label" data-ref="label"></span>
            <span data-ref="value"></span>
        </span>
    </template>

    <!-- Error state -->
    <template id="tmplYearWheelError">
        <div class="text-center text-muted py-5">
            <i class="pli-warning-window fs-1 mb-2 d-block"></i>
            <p>Kunne ikke hente årshjulsdata. Prøv igen senere.</p>
        </div>
    </template>

    <!-- Legend: no tags message -->
    <template id="tmplNoTags">
        <span class="legend-no-tags">Ingen årshjul-tags fundet</span>
    </template>

</th:block>

<th:block th:fragment="yearWheelToggle">
    <div class="view-toggle-group" id="viewToggle">
        <button class="toggle-btn active" type="button" id="btnTableView">
            <i class="pli-list-view"></i> Liste
        </button>
        <button class="toggle-btn" type="button" id="btnYearWheel">
            <i class="pli-calendar-4"></i> Årshjul
        </button>
    </div>

    <div class="year-nav yw-hidden" id="yearNav">
        <button type="button" id="yearPrev" title="Forrige år"><i class="pli-arrow-left"></i></button>
        <span class="year-label" id="yearLabel"></span>
        <button type="button" id="yearNext" title="Næste år"><i class="pli-arrow-right"></i></button>
    </div>

    <!-- Only visible for admins -->
    <div th:if="${hasReadAll}" class="form-check form-switch ms-3 d-none" id="onlyMineToggleContainer">
        <input class="form-check-input" type="checkbox" role="switch" id="onlyMineToggle">
        <label class="form-check-label small" for="onlyMineToggle">Kun mine opgaver</label>
    </div>
</th:block>
</body>
</html>
