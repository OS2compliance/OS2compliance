<!DOCTYPE html>
<html lang="da"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="modalWrapper(title, content, footer)" class="modal-dialog modal-xl">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" th:text="${title}">Titel</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body d-flex flex-column gap-3 justify-content-center"  th:insert="${content}">

        </div>
        <div class="modal-footer" th:insert="${footer}">
        </div>
    </div>
</div>

</body>
</html>
