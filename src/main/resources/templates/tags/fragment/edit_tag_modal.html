<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:fragment="edit_tag_modal" class="modal fade" id="editTagModal" tabindex="-1" aria-labelledby="taskLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Rediger Tag</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:id="${formId}" class="row g-3" action="#" th:action="@{/admin/tags/update}" th:object="${tag}"
                  method="post">
                <div class="modal-body">
                    <input id="editIdentifier" th:field="*{id}" type="hidden">
                    <div class="row mt-4">
                        <label for="redigerNavn" class="col-sm-4 col-form-label">Navn</label>
                        <div class="col-sm-8">
                            <input id="redigerNavn" th:field="*{value}" th:value="${value}" type="text" class="form-control" required>
                        </div>
                    </div>
                    <div class="row mt-4">
                        <label for="editTagColorPicker" class="col-sm-4 col-form-label">Farve</label>
                        <div class="d-flex gap-3 justify-content-between align-items-center col-sm-8">
                            <select class="form-select" id="editTagColorPicker" th:field="*{color}">
                                <option th:each="colorOption : ${T(dk.digitalidentity.model.dto.enums.TagColor).values()}"
                                        th:value="${colorOption}"
                                        th:text="${colorOption.message}"
                                        th:style="'background-color: ' + ${colorOption.hexCode} + '; color: ' + ${colorOption.contrastHexCode}"
                                        th:selected="${color != null && color == colorOption}">
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="row mt-4">
                        <label for="editYearWheel" class="col-sm-4 col-form-label">Vis i årshjul</label>
                        <div class="col-sm-8 d-flex align-items-center">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch"
                                       id="editYearWheel" th:field="*{yearWheel}">
                            </div>
                        </div>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuller</button>
                    <button type="submit" class="btn btn-primary" th:form="${formId}">Gem</button>
                </div>
            </form>

        </div>
    </div>
</div>
</body>
</html>
