<!DOCTYPE html>
<html lang="da">
<head th:replace="~{fragments/header :: head (gridjs = true, sweetalerts = true, burgermenu = true)}"></head>
<body class="jumping">
<link rel="stylesheet" th:href="@{/css/tasks.css}" />
<link rel="stylesheet" th:href="@{/css/year-wheel.css}" />

<div id="root" class="root mn--max hd--expanded">
    <section id="content" class="content">
        <div class="content__header content__boxed overlapping">
            <div class="content__wrap">
                <div class="d-md-flex">
                    <div class="me-auto">
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item"><a th:href="@{/dashboard}">Hjem</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Opgavecenter</li>
                            </ol>
                        </nav>
                        <h1 class="page-title mb-0 mt-2">Opgavecenter</h1>
                        <p class="lead"></p>
                    </div>
                    <div class="align-self-center d-inline-flex gap-2">
                        <div th:replace="~{fragments/component/pageTopButton :: infoButton(id='saveAsExcelButton', text='Gem som Excel', iconClass='ti-bookmark')}"></div>
                        <div th:replace="~{fragments/component/createTaskButton :: createTaskButton}"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="content__boxed">
            <div class="content__wrap">
                <article class="d-md-flex gap-4">
                    <div class="flex-fill">
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                                    <div class="d-flex align-items-center gap-3">
                                        <div th:replace="~{fragments/year-wheel :: yearWheelToggle}"></div>
                                        <div class="tableOptionsContainer">
                                            <div th:replace="~{statistic/fragment/toggleButton :: toggleStatisticButton}"></div>
                                        </div>
                                    </div>
                                    <div class="d-flex gap-2 flex-column">
                                        <div class="input-group gap-2">
                                            <label for="taskDateFieldSelect" class="col-form-label text-nowrap">Filtrer efter dato</label>
                                            <select id="taskDateFieldSelect" class="form-control form-select w-auto">
                                                <option th:each="dateFilter : ${T(dk.digitalidentity.model.dto.TaskDateFilter).values()}"
                                                        th:value="${dateFilter}" th:text="${dateFilter.message}"></option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="d-flex gap-2 flex-column">
                                        <div class="d-flex align-items-center gap-2">
                                            <label for="taskFilterFrom" class="col-form-label">Fra</label>
                                            <div class="input-group">
                                                <input id="taskFilterFrom" type="text" class="form-control"
                                                       name="taskFilterFrom">
                                                <button id="taskFilterFromBtn" class="btn btn-primary" type="button">
                                                    <i class="pli-calendar-4 fs-5"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <div class="d-flex align-items-center gap-2">
                                            <label for="taskFilterTo" class="col-form-label">Til</label>
                                            <div class="input-group">
                                                <input id="taskFilterTo" type="text" class="form-control"
                                                       name="taskFilterTo">
                                                <button id="taskFilterToBtn" class="btn btn-primary" type="button">
                                                    <i class="pli-calendar-4 fs-5"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div id="tasksDatatable"></div>
                                <div th:replace="~{fragments/year-wheel :: yearWheel}"></div>

                                <!-- Custom search selector-->
                                <select class="form-control form-select editField" data-trigger="" name="assignmentTypeSelector" id="assignmentTypeSelector" tabindex="-1" required >
                                    <option th:text="'Alle'" th:value="null"></option>
                                    <option th:each="assignmentType : ${T(dk.digitalidentity.model.entity.enums.TaskType).values()}"
                                            th:value="${assignmentType}" th:text="${assignmentType.message}"></option>
                                </select>

                                <!-- Custom search selectors-->
                                <select class="form-control form-select editField" data-trigger="" name="taskRepetitionSelector" id="taskRepetitionSelector" tabindex="-1" required >
                                    <option th:text="'Alle'" th:value="null"></option>
                                    <option th:each="option : ${T(dk.digitalidentity.model.entity.enums.TaskRepetition).values()}"
                                            th:value="${option}" th:text="${option.message}"></option>
                                </select>

                                <!-- Custom search selectors-->
                                <select class="form-control form-select editField" data-trigger="" name="taskStatusSearchSelector" id="taskStatusSearchSelector" tabindex="-1" multiple hidden>
                                    <option th:text="'Alle'" th:value="${''}"></option>
                                    <option th:each="option : ${T(dk.digitalidentity.model.entity.enums.TaskDeadlineStatus).values()}"
                                            th:value="${option}"
                                            th:text="${option.name() == 'FUTURE'} ? 'Ikke udført' : ${option.message}"></option>
                                </select>
                                <div th:replace="~{fragments/component/customSelector :: multiSelectDropdown('taskStatusSearchSelector', ~{::  #taskStatusDropdownItems})}">
                                    <ul id="taskStatusDropdownItems" class="dropdown-menu">
                                        <li><label class="dropdown-item d-flex gap-2 align-items-center"><input type="checkbox" th:value="${''}"> Alle</label></li>
                                        <li th:each="option : ${T(dk.digitalidentity.model.entity.enums.TaskDeadlineStatus).values()}">
                                            <label class="dropdown-item d-flex gap-2 align-items-center ps-2">
                                                <input type="checkbox" th:value="${option}">
                                                <span th:text="${option.name() == 'FUTURE'} ? 'Ikke udført' : ${option.message}"></span>
                                            </label>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </article>
            </div>
        </div>
    </section>
    <header th:replace="~{fragments/header :: header}"></header>
    <nav th:replace="~{fragments/navbar :: main (page='opgavecenter')}"></nav>
</div>

<div id="copyTaskContainer"></div>
<div class="modal fade" id="editTaskDialog" aria-labelledby="taskLabel" aria-hidden="true"></div>
<div th:replace="~{fragments/excel-export-modal :: excelExportModal}"></div>
<div th:replace="~{fragments/footer :: footer (taskDialog = true, gridjs = true, sweetalerts = true, statistic = true)}"></div>

<script th:inline="javascript">
    /*<![CDATA[*/
    /*[+
        var gridTasksUrl = [[@{/rest/tasks/list}]];
        var exportTasksUrl = [[@{/rest/tasks/export}]];
        var viewUrl = [[@{/tasks/}]];
        var deleteUrl = [[@{/tasks/}]];
        var baseUrl = [[@{/tasks/}]];
        var superuser = [[${superuser}]];
        var yearWheelUrl = [[@{/rest/tasks/year-wheel}]];
    +]*/
    /*]]>*/
</script>
<script th:src="@{/js/task/form.js}" defer></script>
<script type="module" th:src="@{/js/task/task-center.js}" defer></script>
<script type="module" th:src="@{/js/task/year-wheel.js}" defer></script>
</body>

</html>
