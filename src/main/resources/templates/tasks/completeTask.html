<th:block th:fragment="completeTask">
    <div class="modal fade" id="completeTaskModal" tabindex="-1" aria-labelledby="taskLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Udfør <span th:text="${#strings.toLowerCase(task.taskType.getMessage())}"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="min-height: 200px;">
                    <form th:name="${referral}" id="completeTaskForm" class="row g-3 needs-validation" action="#" th:action="${referral} ?  @{/tasks/complete} + '?referral=' + ${referral} :  @{/tasks/complete}" method="post" th:object="${completionForm}" novalidate>
                        <input name="taskId" th:value="${task.id}" type="hidden">
                        <input name="taskType" th:value="${task.taskType.name()}" type="hidden">
                        <div class="row mt-3" th:if="${task.taskType.name() == 'CHECK'}">
                            <label for="taskResultSelect" class="col-sm-4 col-form-label">Resultat </label>
                            <div class="col-sm-8">
                                <select class="form-control form-select" id="taskResultSelect" th:field="*{taskResult}">
                                    <option th:each="taskResult : ${T(dk.digitalidentity.model.entity.enums.TaskResult).values()}"
                                    th:value="${taskResult}" th:text="${taskResult.getValue()}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="row mt-3" th:if="${task.subTasks != null and !task.subTasks.isEmpty()}">
                            <label class="col-sm-4 col-form-label">Checkliste</label>
                            <div class="col-sm-8">
                                <div class="border rounded p-3 bg-light">
                                    <div th:each="subTask, iterStat : ${task.subTasks}" class="form-check mb-2">
                                        <input class="form-check-input"
                                               type="checkbox"
                                               th:id="'completeSubTask' + ${subTask.id}"
                                               name="subTasksCompleted"
                                               th:value="${subTask.id}"
                                               th:checked="${subTask.completed}">
                                        <label class="form-check-label" th:for="'completeSubTask' + ${subTask.id}" th:text="${subTask.name}"></label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <label for="completionComment" class="col-sm-4 col-form-label">Kommentar</label>
                            <div class="col-sm-8">
                                <textarea id="completionComment" class="form-control" placeholder="Indtast kommentar til udførsel" th:field="*{comment}" rows="3"></textarea>
                                <div class="invalid-feedback">Der skal indtastes en beskrivelse</div>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <label th:for="${'TaskDeadline'}" class="col-sm-4 col-form-label">Dato for udførsel</label>
                            <div class="col-sm-8">
                                <div class="input-group">
                                    <input id="TaskDeadline" type="text" class="form-control" th:field="*{dateOfCompletion}" required>
                                    <button th:id="${'TaskDeadlineBtn'}" class="btn btn-primary" type="button" style="z-index: 0; border-top-right-radius: 0.4375rem; border-bottom-right-radius: 0.4375rem;">
                                        <i class="pli-calendar-4 fs-5"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <label for="completionLinkForDocument" class="col-sm-4 col-form-label">Link til dokumentation</label>
                            <div class="col-sm-8">
                                <input id="completionLinkForDocument" class="form-control" th:field="*{documentLink}">
                            </div>
                        </div>
                        <div class="row mt-3" th:if="${task.taskType.name() == 'TASK'}">
                            <label for="documentRelationSelect" class="col-sm-4 col-form-label">Relation til dokument</label>
                            <div class="col-sm-8">
                                <select class="form-control form-select choices__input" data-trigger="" name="documentRelation" id="documentRelationSelect" hidden="" tabindex="-1"></select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Annuller</button>
                    <button type="submit" form="completeTaskForm" class="btn btn-secondary">Gem</button>
                </div>
            </div>
        </div>
    </div>
</th:block>
