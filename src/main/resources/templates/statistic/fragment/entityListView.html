<!DOCTYPE html>
<html lang="da"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="entityListView">
    <table id="entityListTable" class="table table-striped table-hover table-condensed">
        <thead>
        <tr>
            <th>Navn</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entity : ${entities}">
            <td>
                <a th:href="${entity.url}" th:text="${entity.name}"></a>
            </td>
        </tr>
        </tbody>

    </table>

</div>
</body>
</html>
