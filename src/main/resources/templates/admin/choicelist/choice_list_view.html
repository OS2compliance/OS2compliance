<!DOCTYPE html>
<html lang="da" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/header :: head (gridjs = true, sweetalerts = true, burgermenu = true)}"></head>
<body class="jumping">
<div id="root" class="root mn--max hd--expanded">
<!--    TODO: Missing action endpoint-->
    <section id="content" class="content">
        <div class="content__header content__boxed overlapping">
            <div class="content__wrap">
                <div class="d-md-flex">
                    <div class="me-auto">
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item"><a th:href="@{/dashboard}">Hjem</a></li>
                                <li class="breadcrumb-item active" aria-current="page"><a th:href="@{/admin/choicelists}">Valglister</a></li>
                            </ol>
                        </nav>
                        <h1 class="page-title mb-0 mt-2 mb-2">
                            <span th:text="${choiceList?.name}"></span>
                        </h1>
                    </div>
                    <div class="align-self-center d-inline-flex gap-2">
                        <button sec:authorize="hasAnyRole('ROLE_create_all')" id="createChoiceValueButton" th:data-id="${choiceList?.id}" type="button" class="btn btn-info btn-lg hstack gap-2">
                            <i class="ti-plus"></i>
                            <span class="vr"></span>
                            <span>Opret ny</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="content__boxed">
            <div class="content__wrap">
                <div class="tab-base">
                    <div class="tab-content">
                        <div id="choiceValueTable"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <header th:replace="~{fragments/header :: header}"></header>
    <nav th:replace="~{fragments/navbar :: main (page='choicelists')}"></nav>
</div>

<div class="modal fade" id="createOrEditChoiceValueModal" tabindex="-1" aria-labelledby="taskLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="choiceValueForm" method="POST">
                <div class="modal-header">
                    <h5 class="modal-title" id="choiceValueModalTitle">Opret ny</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row mt-3">
                        <label for="name" class="col-sm-4 col-form-label">Navn</label>
                        <div class="col-sm-8">
                            <input class="form-control" id="name" name="caption" type="text" placeholder="Indtast navn" required>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <label for="description" class="col-sm-4 col-form-label">Beskrivelse</label>
                        <div class="col-sm-8">
                            <input class="form-control" id="description" name="description" type="text" placeholder="Indtast beskrivelse">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuller</button>
                    <button type="submit" class="btn btn-primary">Gem</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer (gridjs = true, sweetalerts = true)}"></div>
<script th:src="@{/js/admin/customChoiceLists/customChoiceValues.js}" defer></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    /*[+
        const data = [[${choiceValues}]];
        const choiceListId = [[${choiceList.id}]];
    +]*/
    let token = document.getElementsByName("_csrf")[0].getAttribute("content");
    let customChoiceValuesService, networkService

    document.addEventListener("DOMContentLoaded", function(event) {
        customChoiceValuesService = new CustomChoiceValuesService();
        networkService = new NetworkService(token)
    });

    /*]]>*/
</script>

</body>
</html>
