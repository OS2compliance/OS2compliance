services:
  db:
    image: mariadb:10.6.14
    environment:
      MARIADB_DATABASE: 'os2compliance'
      MARIADB_ROOT_PASSWORD: 'Test1234'
    ports:
      - "3306:3306"
    expose:
      - '3306'
    volumes:
      - compliance-db:/var/lib/mysql

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME: "http://localhost:8081"
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
    volumes:
      - ./seed/keycloak/dev-realm.json:/opt/keycloak/data/import/os2compliance-realm.json:ro
    ports:
      - "8081:8080"

  os2compliance:
    build: .
    ports:
      - "8343:8343"
    expose:
      - "8343"
    env_file:
      - .env
      - .env.dev
    environment:
      DB_URL: "jdbc:mysql://db/os2compliance?useSSL=false&serverTimezone=UTC"
      DB_USERNAME: "root"
      DB_PASSWORD: "Test1234"
      SCHEDULING_ENABLED: "true"
      SAML_ENTITY_ID: "https://os2compliance"
      SAML_KEYSTORE_LOCATION: "security/saml-keystore-dev.pfx"
      SAML_KEYSTORE_PASSWORD: "Password1234"
      SSL_KEYSTORE_LOCATION: "security/ssl-dev.pfx"
      SSL_KEYSTORE_PASSWORD: "Test1234"
    volumes:
      - ./security:/app/security

  # Applies the dev user seed once the users table exists (i.e. after the
  # os2compliance Flyway migrations). The mysql initdb dir can't be used for
  # this since it runs before the schema is created.
  db-seed:
    image: mariadb:10.6.14
    depends_on:
      - db
      - os2compliance
    restart: "no"
    entrypoint: |
      bash -c '
      until mysql -h db -uroot -pTest1234 os2compliance -e "SELECT 1 FROM users LIMIT 1" >/dev/null 2>&1; do
        echo "Waiting for os2compliance schema..."; sleep 3;
      done
      mysql -h db -uroot -pTest1234 os2compliance < /seed/dev-user.sql
      echo "Dev user seeded."
      '
    volumes:
      - ./seed/mysql:/seed:ro

volumes:
  compliance-db:
